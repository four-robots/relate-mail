# Default values for relate-mail.
# Override with --set or a custom values.yaml.

nameOverride: ""
fullnameOverride: ""

# Image settings shared by all four service images (api, smtp, pop3, imap).
# Each component below can override `image.repository` and `image.tag`.
image:
  registry: ghcr.io
  repository: four-robots/relate-mail
  tag: ""              # defaults to .Chart.AppVersion when empty
  pullPolicy: IfNotPresent

imagePullSecrets: []
# - name: ghcr-creds

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop: ["ALL"]

# Database connection.
# If postgresql.enabled=true, this chart deploys a single-node PostgreSQL
# and constructs the connection string from postgresql.* values.
# Otherwise, set database.existingSecret OR database.connectionString
# (or the host/user/password fields below) to point at an external DB.
database:
  # Plaintext connection string. Used only when set and no existingSecret is provided.
  connectionString: ""
  # Reference an existing Secret with key `connectionString`.
  existingSecret: ""
  existingSecretKey: connectionString
  # Used to build a connection string when both connectionString and existingSecret are empty.
  host: ""
  port: 5432
  database: relate_mail
  username: postgres
  password: ""

# In-chart PostgreSQL (single replica, suitable for dev / small deployments).
# For production, prefer an external managed Postgres and set this to false.
postgresql:
  enabled: true
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  auth:
    username: postgres
    password: ""               # required when postgresql.enabled=true and existingSecret is empty
    database: relate_mail
    existingSecret: ""         # Secret with key `password`
    existingSecretKey: password
  service:
    port: 5432
  persistence:
    enabled: true
    storageClass: ""
    size: 10Gi
    accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

# OIDC (optional). Leave authority empty to run the API in unauthenticated dev mode.
oidc:
  authority: ""
  audience: ""

# Internal API key used by the SMTP host to call the API's internal endpoints.
# Provide it inline OR via an existing Secret with key `internalApiKey`.
internal:
  apiKey: ""
  existingSecret: ""
  existingSecretKey: internalApiKey

# Security settings shared across all hosts.
# `authenticationSalt` is the HMAC key used by the auth rate limiter to hash
# usernames + client IPs for tracking failed-login attempts. The .NET API
# *requires* this in production and refuses to start without it.
#
# Provide it inline, via an existing Secret, or leave both empty — the chart
# will lookup an existing chart-managed Secret across upgrades, and only
# generate a fresh random salt on the first install.
security:
  authenticationSalt: ""
  existingSecret: ""
  existingSecretKey: authenticationSalt

# CORS for the API (comma-separated origins).
cors:
  allowedOrigins: ""

# Outbound mail delivery.
# The DeliveryQueueProcessor runs in every host that calls AddInfrastructure
# (api, smtp, pop3, imap) — so these settings are pushed to all four
# deployments via a shared ConfigMap. Set `enabled: true` to actually
# dispatch queued mail; leave it false to keep mail queued.
#
# When `relayHost` is set, mail is relayed through that smarthost (Resend,
# SES, SendGrid, Mailgun, an internal Postfix relay, etc.). When empty,
# the SMTP daemon attempts direct-to-MX delivery, which is unlikely to be
# accepted from most cluster egress IPs.
outbound:
  enabled: false
  relayHost: ""
  relayPort: 587
  relayUseTls: true
  relayUsername: ""
  # Provide the relay password inline OR via an existing Secret with key `relayPassword`.
  relayPassword: ""
  existingSecret: ""
  existingSecretKey: relayPassword
  # The MAIL FROM domain announced to the relay (also used in HELO/EHLO).
  senderDomain: ""
  maxConcurrency: 5
  maxRetries: 10
  retryBaseDelaySeconds: 60
  queuePollingIntervalSeconds: 15
  smtpTimeoutSeconds: 30

# EF Core schema migrations.
# Runs as a Helm pre-install/pre-upgrade Job that applies pending migrations
# against the target database before the API/protocol pods start. The image
# is a self-contained EF Core migration bundle — no SDK or EF tools required
# at runtime, and idempotent (safe to re-run).
migrations:
  enabled: true
  image:
    repository: ""             # falls back to {{ image.registry }}/{{ image.repository }}-migrations
    tag: ""
  # Helm will retry the Job up to backoffLimit times before failing the release.
  backoffLimit: 3
  # Keep finished Jobs around briefly so logs are inspectable, then GC.
  ttlSecondsAfterFinished: 300
  # Extra environment variables for the migration container. Useful when the
  # bundle needs runtime-only config that isn't supplied by the chart, e.g.
  # forcing a write path off a read-only root filesystem.
  # Example:
  #   extraEnv:
  #     - name: DOTNET_BUNDLE_EXTRACT_BASE_DIR
  #       value: /tmp/.net
  extraEnv: []
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

# REST API workload.
api:
  enabled: true
  replicaCount: 1
  image:
    repository: ""             # falls back to {{ image.registry }}/{{ image.repository }}-api
    tag: ""
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  env: []                      # extra env vars: [{name: FOO, value: bar}, ...]
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: relate-mail.local
        paths:
          - path: /
            pathType: Prefix
    tls: []
    # - secretName: relate-mail-tls
    #   hosts:
    #     - relate-mail.local

# SMTP submission + (optional) MX workload.
smtp:
  enabled: true
  replicaCount: 1
  image:
    repository: ""             # falls back to {{ image.registry }}/{{ image.repository }}-smtp
    tag: ""
  serverName: smtp.example.com
  requireAuthentication: true
  submissionPort: 587
  implicitTlsPort: 465
  healthPort: 8081
  mx:
    enabled: false
    port: 25
    hostedDomains: []          # e.g. ["example.com"]
    validateRecipients: true
  service:
    type: LoadBalancer
    annotations: {}
    externalTrafficPolicy: Local
    loadBalancerIP: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  env: []

pop3:
  enabled: true
  replicaCount: 1
  image:
    repository: ""             # falls back to {{ image.registry }}/{{ image.repository }}-pop3
    tag: ""
  serverName: pop3.example.com
  requireAuthentication: true
  port: 110
  securePort: 995
  healthPort: 8082
  service:
    type: LoadBalancer
    annotations: {}
    externalTrafficPolicy: Local
    loadBalancerIP: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  env: []

imap:
  enabled: true
  replicaCount: 1
  image:
    repository: ""             # falls back to {{ image.registry }}/{{ image.repository }}-imap
    tag: ""
  serverName: imap.example.com
  requireAuthentication: true
  port: 143
  securePort: 993
  healthPort: 8083
  service:
    type: LoadBalancer
    annotations: {}
    externalTrafficPolicy: Local
    loadBalancerIP: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  env: []

# Web SPA frontend.
# nginx-served React/Vite bundle. Set `web.enabled=true` to deploy.
#
# Runtime config (oidc, apiUrl) is rendered into config.json at container
# startup. The /api path inside the SPA's nginx is reverse-proxied to the
# in-cluster API service via ${API_BACKEND}; that env var is auto-set to the
# chart's api Service unless `apiBackend` overrides it below.
web:
  enabled: false
  replicaCount: 1
  image:
    repository: ""             # falls back to {{ image.registry }}/{{ image.repository }}-web
    tag: ""
  service:
    type: ClusterIP
    port: 8080
  containerPort: 8080
  # SPA's runtime API URL (baked into config.json, used by the JS client).
  # Relative path means same-origin — works when web's ingress also routes
  # /api to the API service (via the embedded nginx proxy_pass below).
  apiUrl: /api
  # Override the upstream that the SPA's embedded nginx /api proxy points at.
  # Defaults to the in-cluster api Service URL. Set to e.g. http://api-other:8080
  # only if you are intentionally fronting a different API.
  apiBackend: ""
  oidc:
    clientId: ""
    redirectUri: ""
    scope: "openid profile email"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  # HTTP path used for startup/liveness/readiness probes. Empty disables probes.
  # The image's nginx.conf serves a 200 "ok" at /healthz.
  healthPath: /healthz
  env: []
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: relate-mail.local
        paths:
          - path: /
            pathType: Prefix
    tls: []
    # - secretName: relate-mail-web-tls
    #   hosts:
    #     - relate-mail.local

# Scheduling
nodeSelector: {}
tolerations: []
affinity: {}
