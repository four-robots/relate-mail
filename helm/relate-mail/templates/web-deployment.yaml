{{- if .Values.web.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "relate-mail.componentFullname" (list . "web") }}
  labels:
    {{- include "relate-mail.componentLabels" (list . "web") | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicaCount }}
  selector:
    matchLabels:
      {{- include "relate-mail.componentSelectorLabels" (list . "web") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "relate-mail.componentSelectorLabels" (list . "web") | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "relate-mail.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: web
          image: {{ include "relate-mail.image" (dict "top" . "component" "web" "config" .Values.web) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.web.containerPort }}
              protocol: TCP
          env:
            - name: API_URL
              value: {{ .Values.web.apiUrl | quote }}
            - name: API_BACKEND
              value: {{ default (printf "http://%s:%d" (include "relate-mail.componentFullname" (list . "api")) (int .Values.api.service.port)) .Values.web.apiBackend | quote }}
            {{- if .Values.oidc.authority }}
            - name: OIDC_AUTHORITY
              value: {{ .Values.oidc.authority | quote }}
            {{- end }}
            {{- if .Values.web.oidc.clientId }}
            - name: OIDC_CLIENT_ID
              value: {{ .Values.web.oidc.clientId | quote }}
            {{- end }}
            {{- if .Values.web.oidc.redirectUri }}
            - name: OIDC_REDIRECT_URI
              value: {{ .Values.web.oidc.redirectUri | quote }}
            {{- end }}
            {{- if .Values.web.oidc.scope }}
            - name: OIDC_SCOPE
              value: {{ .Values.web.oidc.scope | quote }}
            {{- end }}
            {{- with .Values.web.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if .Values.web.healthPath }}
          startupProbe:
            httpGet:
              path: {{ .Values.web.healthPath }}
              port: http
            periodSeconds: 2
            failureThreshold: 15
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: {{ .Values.web.healthPath }}
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: {{ .Values.web.healthPath }}
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          {{- end }}
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
